<!doctype html>
<!--
  Your browser's UI. Neeko loads this page in place of Firefox's interface.
  Put the website wherever you like: Neeko keeps it on top of the element
  marked data-neeko-content, matching its position, size and corner rounding.
  Elements marked data-neeko-overlay are drawn over the page when they
  overlap it. On macOS the window buttons appear wherever
  data-neeko-window-buttons is.

  This is the demo UI: a tab list, an address bar with a bookmark star, a
  menu, a find bar, a bar for permission prompts, bookmarks and downloads
  lists, and a status line for links,
  built only on the Neeko API (the global
  `neeko` object, see docs/api.md). It's plain on purpose, just enough to show every API feature
  working. Replace it with your own.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="script-src chrome:; object-src 'none'"
    />
    <link rel="stylesheet" href="style.css" />
    <script src="early.js"></script>
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <div data-neeko-window-buttons></div>
    <!-- With the tab list hidden, it slides out over the page: an overlay. -->
    <aside data-neeko-overlay>
      <button id="new-tab" title="New tab (Cmd+T)">+ New tab</button>
      <ol id="tabs"></ol>
      <section id="bookmarks" hidden>
        <h2>Bookmarks</h2>
        <ol></ol>
      </section>
      <section id="downloads" hidden>
        <h2>Downloads</h2>
        <ol></ol>
      </section>
      <!-- The link the pointer is over, or the page's loading status. -->
      <p id="status" hidden></p>
    </aside>
    <header>
      <button id="back" title="Back (Cmd+[)" disabled>&larr;</button>
      <button id="forward" title="Forward (Cmd+])" disabled>&rarr;</button>
      <button id="reload" title="Reload (Cmd+R)">&#x21bb;</button>
      <input
        id="address"
        placeholder="Search or enter address"
        spellcheck="false"
        autocomplete="off"
      />
      <button id="star" title="Bookmark this page (Cmd+D)" disabled>&#x2606;</button>
      <button id="fullscreen" title="Full screen (Ctrl+Cmd+F)">&#x2922;</button>
      <button id="menu-button" title="Menu" aria-haspopup="menu">&#x22EF;</button>
    </header>
    <!-- A menu that drops down over the web page. data-neeko-overlay tells
         Neeko to draw it over the page, and give it the pointer there. -->
    <div id="menu" role="menu" data-neeko-overlay hidden>
      <button data-command="newTab">New tab</button>
      <button data-command="duplicate">Duplicate tab</button>
      <button data-command="mute">Mute tab</button>
      <button data-command="moveToStart">Move tab to the top</button>
      <button data-command="group">Add tab to a new group</button>
      <hr />
      <button data-command="tabsSide">Tabs on the right</button>
      <button data-command="hideTabs">Hide the tab list</button>
      <p class="label">Appearance</p>
      <button data-command="colorScheme" data-scheme="system">System</button>
      <button data-command="colorScheme" data-scheme="light">Light</button>
      <button data-command="colorScheme" data-scheme="dark">Dark</button>
      <hr />
      <button data-command="fullscreen">Full screen</button>
    </div>
    <!-- Find in page (Cmd+F): drawn over the top right of the page, an
         overlay like the menu. Firefox's own find bar stays closed. -->
    <div id="find" data-neeko-overlay hidden>
      <input
        id="find-text"
        placeholder="Find in page"
        spellcheck="false"
        autocomplete="off"
      />
      <span id="find-count"></span>
      <button id="find-previous" title="Previous (Shift+Enter)">&uarr;</button>
      <button id="find-next" title="Next (Enter)">&darr;</button>
      <label title="Highlight all"
        ><input id="find-highlight" type="checkbox" /> All</label
      >
      <button id="find-close" title="Close (Escape)">&times;</button>
    </div>
    <!-- The prompt bar sits above the page and pushes it down. (It could
         overlap the page instead, marked data-neeko-overlay like the menu.) -->
    <section id="prompt" hidden>
      <div class="text">
        <p class="message"></p>
        <p class="hint"></p>
      </div>
      <button class="learn-more">Learn more</button>
      <label class="remember"><input type="checkbox" /> <span></span></label>
      <div class="actions"></div>
    </section>
    <main data-neeko-content></main>
  </body>
</html>

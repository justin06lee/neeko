<!doctype html>
<!--
  Your browser's UI. Neeko loads this page in place of Firefox's interface.
  Put the website wherever you like: Neeko keeps it on top of the element
  marked data-neeko-content, matching its position, size and corner rounding.
  On macOS the window buttons appear wherever data-neeko-window-buttons is.

  This is the demo UI: a tab list and an address bar, built only on the Neeko
  API (the global `neeko` object, see docs/api.md). It's plain on purpose,
  just enough to show every API feature working. Replace it with your own.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="script-src chrome:; object-src 'none'"
    />
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <div data-neeko-window-buttons></div>
    <aside>
      <button id="new-tab" title="New tab (Cmd+T)">+ New tab</button>
      <ol id="tabs"></ol>
    </aside>
    <header>
      <button id="back" title="Back (Cmd+[)" disabled>&larr;</button>
      <button id="forward" title="Forward (Cmd+])" disabled>&rarr;</button>
      <button id="reload" title="Reload (Cmd+R)">&#x21bb;</button>
      <input
        id="address"
        placeholder="Search or enter address"
        spellcheck="false"
        autocomplete="off"
      />
    </header>
    <main data-neeko-content></main>
  </body>
</html>
